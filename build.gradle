plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'io.56k-panic'
version = 'dev'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
}

repositories {
    mavenCentral()
}

def lwjglVersion = '3.4.1'
def jomlVersion = '1.10.8'

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-stb'
    implementation "org.joml:joml:${jomlVersion}"
    // Linux natives
    runtimeOnly "org.lwjgl:lwjgl::natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-glfw::natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-opengl::natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-stb::natives-linux"
    // Windows natives
    runtimeOnly "org.lwjgl:lwjgl::natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-glfw::natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-opengl::natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-stb::natives-windows"
    // MacOS natives
    runtimeOnly "org.lwjgl:lwjgl::natives-macos"
    runtimeOnly "org.lwjgl:lwjgl-glfw::natives-macos"
    runtimeOnly "org.lwjgl:lwjgl-opengl::natives-macos"
    runtimeOnly "org.lwjgl:lwjgl-stb::natives-macos"
}

sourceSets {
    main {
        java {
            srcDirs = ['src/java']
        }
        resources {
            srcDirs = ['src/asset']
        }
    }
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.matching { it.name == 'engine.Launcher.main()' }.configureEach {
    if (it instanceof JavaExec) {
        it.jvmArgs '--enable-native-access=ALL-UNNAMED'
    }
}


jar {
    manifest {
        attributes 'Main-Class': 'engine.Launcher'
    }
}

tasks.named('shadowJar') {
    archiveClassifier.set('fat')
    mergeServiceFiles()
    // Explicitly disable any bytecode/package rewriting features.
    enableRelocation = false
}

tasks.register('fastFatJar') {
    group = 'build'
    description = 'Fast fat-jar build (no tests), output in build/libs/*-fat.jar'
    dependsOn tasks.named('shadowJar')
}
